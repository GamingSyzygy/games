<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Games</title>
<style>
  :root { --bg: #000; --fg: #e8e8e8; --muted: #8a8a8a; --accent: #4fd1ff; --card: #111; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
         font-family: "Courier New", monospace; display: flex; justify-content: center; padding: 48px 16px; }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 2rem; letter-spacing: 0.1em; margin: 0 0 32px; text-align: center; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
  a.game { display: block; padding: 20px; background: var(--card); border: 1px solid var(--line);
           color: var(--fg); text-decoration: none; }
  a.game:hover, a.game:focus { border-color: var(--accent); outline: none; }
  .name { font-size: 1.25rem; color: var(--accent); }
  .desc { color: var(--muted); margin-top: 6px; }
  .soon { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>BROWSER GAMES</h1>
  <ul>
    <li><a class="game" href="galaxy-raiders/">
      <div class="name">Galaxy Raiders</div>
      <div class="desc">Arcade space shooter.</div>
    </a></li>
    <li><a class="game" href="cavern-miner/">
      <div class="name">Cavern Miner</div>
      <div class="desc">Cavern platformer. Collect the sparkles before your lamp burns out.</div>
    </a></li>
  </ul>
</main>
</body>
</html>
